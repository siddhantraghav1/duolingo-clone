# Render "Blueprint": deploys the FastAPI backend.
# On render.com: New > Blueprint > pick this repository.
# The SQLite file lives on the instance's disk; on the free plan it is wiped on
# restart and the app simply re-seeds itself on startup (see README > Assumptions).
services:
  - type: web
    name: duolingo-clone-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: CORS_ORIGINS
        value: "https://your-frontend.vercel.app" # replace after the frontend is deployed
      - key: ENABLE_DEV_TOOLS
        value: "true" # keeps "Simulate next day" / "Reset demo" available for the demo
